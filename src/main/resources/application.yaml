spring:
    application:
        name: storage-manager
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
    #      show-sql: true
    #      properties:
    #        hibernate:
    #          format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration

    # File Upload Configuration
    # Item type imports can include embedded image data from many rows.
    servlet:
        multipart:
            max-file-size: 100MB
            max-request-size: 100MB

    # Scheduling
    task:
        scheduling:
            pool:
                size: 5

# Server Configuration
server:
    port: 8080

# Logging
logging:
    level:
        net:
            tmn:
                '[storage_manager]': INFO
        org:
            springframework:
                web: INFO
            flywaydb: INFO

# Notification Configuration
app:
    notification:
        home-assistant:
            enabled: ${APP_NOTIFICATION_HOME_ASSISTANT_ENABLED:false}
            url: ${APP_NOTIFICATION_HOME_ASSISTANT_URL:}
            token: ${APP_NOTIFICATION_HOME_ASSISTANT_TOKEN:}
        sms:
            enabled: ${APP_NOTIFICATION_SMS_ENABLED:false}
        console:
            enabled: ${APP_NOTIFICATION_CONSOLE_ENABLED:false}

    backup:
        scheduled:
            enabled: ${APP_BACKUP_SCHEDULED_ENABLED:false}
            cron: ${APP_BACKUP_SCHEDULED_CRON:0 0 2 * * ?}
        directory: ${APP_BACKUP_DIRECTORY:database_backups}
        retention:
            days: ${APP_BACKUP_RETENTION_DAYS:30}
        # Include Flyway metadata in new backups for migration-safe restore flows.
        include-flyway-history: ${APP_BACKUP_INCLUDE_FLYWAY_HISTORY:true}

vaadin:
    launch-browser: false
