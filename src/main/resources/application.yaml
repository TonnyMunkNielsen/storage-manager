spring:
    application:
        name: storage-manager
    datasource:
        url: jdbc:postgresql://localhost:5432/storagemanagerdb
        username: admin
        password: admin
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
    #      show-sql: true
    #      properties:
    #        hibernate:
    #          format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration

    # File Upload Configuration
    # Item type imports can include embedded image data from many rows.
    servlet:
        multipart:
            max-file-size: 100MB
            max-request-size: 100MB

    # Scheduling
    task:
        scheduling:
            pool:
                size: 5

# Server Configuration
server:
    port: 8080

# Logging
logging:
    level:
        net:
            tmn:
                '[storage_manager]': DEBUG
        org:
            springframework:
                web: DEBUG
            flywaydb: DEBUG

# Notification Configuration
app:
    notification:
        home-assistant:
            enabled: false
            # TODO: Introduce secrets for these:
            url:
            token:
        sms:
            enabled: false
        console:
            enabled: true

    backup:
        scheduled:
            enabled: true
        # Include Flyway metadata in new backups for migration-safe restore flows.
        include-flyway-history: true

vaadin:
    launch-browser: true
